    <!-- ============================================================= -->

    />

    <!-- Dados estruturados (JSON-LD) — ajuda o Google a entender a página -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Copilot",
        "alternateName": "AI Dev Squad",
        "url": "https://copilot-devsquad.vercel.app/",
        "description": "Time de agentes de IA para desenvolvimento de software, com esteira de PBI a código, filosofias de qualidade e comandos prontos para copiar.",

        "keywords": "agentes de IA, IA para codar, time de IA, criação de software",
        "author": {
          "@type": "Person",
          "name": "Gustavo Nascimento",
          "email": "caous.g@gmail.com",
          "sameAs": [
            "https://www.linkedin.com/in/gusta-nascimento/",
            "https://github.com/Caous"
          ]
        }
      }

    <!-- ============================================================= -->
    <!-- FONTES via CDN (Fontshare + Google Fonts)                     -->
    <!-- Display: Clash Display · Corpo: Satoshi · Mono: JetBrains Mono -->
    <!-- ============================================================= -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- ============================================================= -->
    <!-- BIBLIOTECAS DE EFEITO via CDN                                 -->
    <!-- Carregadas antes do bundle React (window.gsap / window.Lenis) -->
    <!-- `defer` garante ordem: gsap → ScrollTrigger → lenis → app     -->
    <!-- ============================================================= -->
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"
    ></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- `type=module` roda depois dos scripts `defer` acima, então
         window.gsap / window.Lenis já existem quando o React monta. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
