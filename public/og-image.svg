<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#08090c" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)" opacity="0.6" />
  <defs>
    <radialGradient id="glow" cx="82%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#6f6bff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#08090c" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34f0b4" />
      <stop offset="100%" stop-color="#6f6bff" />
    </linearGradient>
  </defs>

  <!-- estrelas -->
  <g fill="#cfd8e3" opacity="0.7">
    <circle cx="180" cy="90" r="1.6"/><circle cx="420" cy="60" r="1.2"/><circle cx="720" cy="110" r="1.8"/>
    <circle cx="980" cy="70" r="1.3"/><circle cx="1100" cy="200" r="1.5"/><circle cx="300" cy="180" r="1.1"/>
    <circle cx="880" cy="540" r="1.4"/><circle cx="150" cy="520" r="1.7"/><circle cx="620" cy="580" r="1.2"/>
  </g>

  <!-- marca -->
  <g transform="translate(96, 92)">
    <rect width="26" height="26" rx="7" fill="#34f0b4" />
    <text x="42" y="21" font-family="'Clash Display', Arial, sans-serif" font-size="30" font-weight="600" fill="#edf1f5">Copilot</text>
  </g>

  <!-- título -->
  <text x="96" y="280" font-family="'Clash Display', Arial, sans-serif" font-size="72" font-weight="600" fill="#edf1f5" letter-spacing="-2">Descubra o poder da</text>
  <text x="96" y="360" font-family="'Clash Display', Arial, sans-serif" font-size="72" font-weight="600" fill="#edf1f5" letter-spacing="-2">Inteligência Artificial:</text>
  <text x="96" y="446" font-family="'Clash Display', Arial, sans-serif" font-size="60" font-weight="600" fill="url(#mint)" letter-spacing="-1">estratégia, time de IA e resultados reais</text>

  <!-- assinatura -->
  <text x="98" y="560" font-family="'JetBrains Mono', monospace" font-size="24" fill="#34f0b4">você é o piloto, a IA é o copiloto</text>
</svg>
